name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate project and build
        run: |
          set -e
          flutter create --org com.example --project-name studyblocker .
          mkdir -p android/app/src/main/res/xml android/app/src/main/res/values
          cat > lib/main.dart <<'EOF'
          import 'dart:async';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          void main() => runApp(const MaterialApp(home: Home(), debugShowCheckedModeBanner: false));

          class Home extends StatefulWidget {
            const Home({super.key});
            @override
            State<Home> createState() => _S();
          }

          class _S extends State<Home> {
            static const ch = MethodChannel('blocker');
            int left = 0;
            bool on = false;
            Timer? t;

            @override
            void initState() {
              super.initState();
              t = Timer.periodic(const Duration(seconds: 1), (_) => tick());
              tick();
            }

            @override
            void dispose() {
              t?.cancel();
              super.dispose();
            }

            Future<void> tick() async {
              final end = await ch.invokeMethod<int>('endTime') ?? 0;
              final en = await ch.invokeMethod<bool>('enabled') ?? false;
              if (!mounted) return;
              setState(() {
                left = ((end - DateTime.now().millisecondsSinceEpoch) / 1000).ceil().clamp(0, 7200);
                on = en;
              });
            }

            String get fmt {
              final h = left ~/ 3600, m = (left % 3600) ~/ 60, s = left % 60;
              return '$h:${m.toString().padLeft(2, '0')}:${s.toString().padLeft(2, '0')}';
            }

            @override
            Widget build(BuildContext c) {
              final locked = left > 0;
              return PopScope(
                canPop: !locked,
                child: Scaffold(
                  body: SafeArea(
                    child: Center(
                      child: Padding(
                        padding: const EdgeInsets.all(24),
                        child: Column(
                          mainAxisSize: MainAxisSize.min,
                          children: locked
                              ? [
                                  const Text('Focus mode ON', style: TextStyle(fontSize: 22)),
                                  Text(fmt, style: const TextStyle(fontSize: 56, fontWeight: FontWeight.bold)),
                                  const Text('Timer khatam hone tak band nahi hoga'),
                                ]
                              : [
                                  if (!on) ...[
                                    const Text('Pehle Accessibility service ON karo'),
                                    ElevatedButton(
                                        onPressed: () => ch.invokeMethod('openSettings'),
                                        child: const Text('Open settings')),
                                  ],
                                  if (on)
                                    ElevatedButton(
                                        onPressed: () async {
                                          await ch.invokeMethod('start');
                                          tick();
                                        },
                                        child: const Text('Start 2-hour session')),
                                  const SizedBox(height: 16),
                                  OutlinedButton(
                                      onPressed: () async {
                                        final p = await showTimePicker(
                                            context: c, initialTime: const TimeOfDay(hour: 18, minute: 0));
                                        if (p != null) await ch.invokeMethod('setSchedule', p.hour * 60 + p.minute);
                                      },
                                      child: const Text('Daily schedule set karo')),
                                ],
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }
          EOF
          cat > android/app/src/main/kotlin/com/example/studyblocker/MainActivity.kt <<'EOF'
          package com.example.studyblocker

          import android.content.Context
          import android.content.Intent
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(e: FlutterEngine) {
                  super.configureFlutterEngine(e)
                  MethodChannel(e.dartExecutor.binaryMessenger, "blocker").setMethodCallHandler { c, r ->
                      val p = getSharedPreferences("b", Context.MODE_PRIVATE)
                      when (c.method) {
                          "start" -> {
                              if (!BlockerService.active(this))
                                  p.edit().putLong("end", System.currentTimeMillis() + 2 * 60 * 60 * 1000L).apply()
                              r.success(null)
                          }
                          "setSchedule" -> {
                              // locked: schedule can't be changed while a session is running
                              if (!BlockerService.active(this)) p.edit().putInt("sched", c.arguments as Int).apply()
                              r.success(null)
                          }
                          "endTime" -> r.success(p.getLong("end", 0L))
                          "enabled" -> r.success(BlockerService.isEnabled(this))
                          "openSettings" -> {
                              startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                              r.success(null)
                          }
                          else -> r.notImplemented()
                      }
                  }
              }
          }
          EOF
          cat > android/app/src/main/kotlin/com/example/studyblocker/BlockerService.kt <<'EOF'
          package com.example.studyblocker

          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.provider.Settings
          import android.view.accessibility.AccessibilityEvent
          import java.util.Calendar

          class BlockerService : AccessibilityService() {
              private val blocked = setOf(
                  "com.instagram.android",
                  "com.google.android.youtube",
                  "com.snapchat.android",
                  "org.telegram.messenger"
              )

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  val pkg = e?.packageName?.toString() ?: return
                  if (pkg in blocked && active(this)) performGlobalAction(GLOBAL_ACTION_HOME)
              }

              override fun onInterrupt() {}

              companion object {
                  fun active(c: Context): Boolean {
                      val p = c.getSharedPreferences("b", Context.MODE_PRIVATE)
                      if (System.currentTimeMillis() < p.getLong("end", 0L)) return true
                      val s = p.getInt("sched", -1)
                      if (s < 0) return false
                      val cal = Calendar.getInstance()
                      val m = cal.get(Calendar.HOUR_OF_DAY) * 60 + cal.get(Calendar.MINUTE)
                      return (m - s + 1440) % 1440 < 120
                  }

                  fun isEnabled(c: Context): Boolean {
                      val s = Settings.Secure.getString(
                          c.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                      ) ?: return false
                      return s.contains(c.packageName + "/" + BlockerService::class.java.name)
                  }
              }
          }
          EOF
          cat > android/app/src/main/res/xml/blocker_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="false"
              android:description="@string/app_name" />
          EOF
          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">Study Blocker</string></resources>
          EOF
          cat > patch.py <<'EOF'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          svc='<service android:name=".BlockerService" android:exported="true" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/blocker_config"/></service>'
          s=s.replace('</application>',svc+'</application>',1)
          open(p,'w').write(s)
          EOF
          python3 patch.py
          flutter build apk --release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
